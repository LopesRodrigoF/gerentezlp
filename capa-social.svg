<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <title>GerenteZ — medindo cada obra, cada real</title>

  <defs>
    <style>
      /* Archivo subsetada apenas nos glifos usados e embutida, para a peca
         nao depender de rede nem da fonte instalada no sistema. */
      @font-face {
        font-family: 'ArchivoGZ';
        font-style: normal;
        font-weight: 900;
        font-stretch: 125%;
        src: url(data:font/woff2;base64,) format('woff2');
      }
      @font-face {
        font-family: 'ArchivoGZ';
        font-style: normal;
        font-weight: 600;
        font-stretch: 100%;
        src: url(data:font/woff2;base64,) format('woff2');
      }
    </style>

    <!-- Campo noturno: pontilhado branco discreto sobre chumbo -->
    <pattern id="campoNoturno" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect width="1" height="1" fill="#FFFFFF" opacity="0.06"/>
    </pattern>

    <!-- Regua: traco menor a cada 11px de origem, dobrado para esta peca -->
    <pattern id="reguaMenor" width="22" height="22" patternUnits="userSpaceOnUse">
      <rect x="0" y="10" width="4" height="12" fill="#FFFFFF" opacity="0.3"/>
    </pattern>

    <!-- Regua: traco maior ambar a cada 5 tracos -->
    <pattern id="reguaMaior" width="104" height="22" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="4" height="22" fill="#FFB400"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="#152C39"/>
  <rect width="1200" height="630" fill="url(#campoNoturno)"/>

  <!-- Simbolo: a trena, ambar sobre chumbo.
       Malha de 96x96 escalada 2,9299x — traco proporcional, nunca afinado. -->
  <g transform="translate(600 202.2) scale(2.9299)">
    <circle cx="0" cy="0" r="34" fill="none" stroke="#FFB400" stroke-width="9"/>
    <circle cx="0" cy="-34" r="6" fill="#FFB400"/>
    <rect x="-4" y="-18" width="8" height="26" rx="3" fill="#FFB400"/>
  </g>

  <!-- Wordmark: Archivo 900, estendida 125%, caixa alta, com o Z ambar -->
  <!-- x deslocado 11px: centraliza a mancha de tinta, nao a caixa de avanco
       (o letter-spacing final e a lateral direita do Z puxariam o texto para a esquerda) -->
  <text x="611" y="447" text-anchor="middle"
        font-family="ArchivoGZ" font-size="96" font-weight="900"
        font-stretch="125%" letter-spacing="1.92"
        fill="#FFFFFF">GERENTE<tspan fill="#FFB400">Z</tspan></text>

  <!-- Lema em branco a 55% -->
  <text x="600" y="513" text-anchor="middle"
        font-family="ArchivoGZ" font-size="48" font-weight="600"
        fill="#FFFFFF" fill-opacity="0.55">medindo cada obra, cada real</text>

  <!-- Faixa de regua ambar na borda inferior -->
  <rect x="0" y="608" width="1200" height="22" fill="url(#reguaMenor)"/>
  <rect x="0" y="608" width="1200" height="22" fill="url(#reguaMaior)"/>
</svg>
